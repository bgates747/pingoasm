[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pingo-terrain"
version = "0.0.0"
description = "Experimental offline terrain pipeline for Pingo on Agon"
requires-python = ">=3.14"
dependencies = [
    "Pillow>=12.3,<13",
]

[tool.setuptools.packages.find]
where = ["src"]
